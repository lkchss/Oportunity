name: CI

on:
  push:
    branches: [ main, algo-optimization ]
  pull_request:
    branches: [ main, algo-optimization ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          ship/pyproject.toml

    # `-e ./ship` pulls the ship package's real dependency list (ddgs,
    # platformdirs, trafilatura, pypdf, python-dotenv, flask) from its own
    # pyproject.toml -- the bulk of the suite is tests/test_ship_*.py and
    # imports these; the previous hand-picked `pytest flask` list predates
    # ship/ and could never collect those tests. The [anthropic]/[openai]/
    # [bundled] extras stay out: every backend SDK is monkeypatched in tests
    # (one importorskip("openai") skips cleanly), and llama-cpp-python needs
    # a wheel index CI has no reason to hit.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e ./ship

    - name: Run tests
      run: |
        python -m pytest tests/ -q
